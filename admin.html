<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BondhuBook Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; }

    /* Login Screen */
    .login-wrap { max-width: 400px; margin: 70px auto; background: #1e293b; padding: 28px; border-radius: 14px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .login-wrap h1 { font-size: 24px; color: #38bdf8; margin-bottom: 6px; text-align: center; }
    .login-wrap p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; text-align: center; }
    .field { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
    .field:focus { border-color: #38bdf8; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }

    /* Dashboard Layout */
    .topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .topbar h2 { font-size: 18px; color: #38bdf8; font-weight: 800; }
    .btn-sm { padding: 7px 12px; border-radius: 7px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-warn { background: #d97706; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-muted { background: #334155; color: #e2e8f0; }

    .container { max-width: 960px; margin: 18px auto; padding: 0 14px; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
    .stat-card span { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
    .stat-card strong { font-size: 24px; color: #38bdf8; }

    /* Navigation Pills */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .tab-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }

    /* Panels */
    .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .panel-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; color: #f1f5f9; }

    .item-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #334155; }
    .item-row:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 10px; max-width: 72%; }
    .item-left img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid #475569; flex-shrink: 0; }
    .item-left h4 { font-size: 14px; color: #f8fafc; word-break: break-word; }
    .item-left p { font-size: 12px; color: #94a3b8; word-break: break-word; }
    .badge-ban { background: #7f1d1d; color: #fca5a5; font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 700; margin-left: 6px; }
    .badge-ok { background: #14532d; color: #86efac; font-size: 11px; padding: 2px 7px; border-radius: 99px; font-weight: 700; margin-left: 6px; }

    .post-thumb { width: 64px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .hidden { display: none !important; }
    .empty { color: #94a3b8; font-size: 13px; padding: 14px 0; text-align: center; }
  </style>
</head>
<body>

  <!-- ADMIN LOGIN -->
  <div id="adminLoginBox" class="login-wrap">
    <h1>BondhuBook Admin</h1>
    <p>অ্যাডমিন অ্যাকাউন্ট দিয়ে লগইন করুন</p>
    <input type="email" id="adminEmail" class="field" placeholder="অ্যাডমিন ইমেইল" />
    <input type="password" id="adminPass" class="field" placeholder="পাসওয়ার্ড" />
    <button id="adminLoginBtn" class="btn btn-primary">ড্যাশবোর্ডে প্রবেশ করুন</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminDashboard" class="hidden">
    <div class="topbar">
      <h2>⚡ BondhuBook Admin</h2>
      <div style="display:flex; gap:8px; align-items:center;">
        <span id="adminIdentity" style="font-size:12px; color:#94a3b8;"></span>
        <button id="adminLogoutBtn" class="btn-sm btn-muted">লগআউট</button>
      </div>
    </div>

    <div class="container">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card"><span>মোট ইউজার</span><strong id="statUsers">0</strong></div>
        <div class="stat-card"><span>মোট পোস্ট</span><strong id="statPosts">0</strong></div>
        <div class="stat-card"><span>মোট স্টোরি</span><strong id="statStories">0</strong></div>
        <div class="stat-card"><span>ব্যানড ইউজার</span><strong id="statBanned">0</strong></div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-atab="users" onclick="switchAdminTab('users')">👥 ইউজার কন্ট্রোল</button>
        <button class="tab-btn" data-atab="posts" onclick="switchAdminTab('posts')">📝 পোস্ট কন্ট্রোল</button>
        <button class="tab-btn" data-atab="stories" onclick="switchAdminTab('stories')">📸 স্টোরি কন্ট্রোল</button>
        <button class="tab-btn" data-atab="broadcast" onclick="switchAdminTab('broadcast')">📢 ব্রডকাস্ট নোটিফিকেশন</button>
      </div>

      <!-- Users Panel -->
      <div id="apanel-users" class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;">
          <div class="panel-title" style="margin:0;">সকল ইউজার তালিকা</div>
          <input type="text" id="adminUserSearch" class="field" placeholder="নাম বা ইমেইল দিয়ে খুঁজুন..." style="max-width:240px; margin:0; padding:8px 12px;" />
        </div>
        <div id="adminUsersList"><div class="empty">লোড হচ্ছে...</div></div>
      </div>

      <!-- Posts Panel -->
      <div id="apanel-posts" class="panel hidden">
        <div class="panel-title">সকল পোস্ট কন্ট্রোল</div>
        <div id="adminPostsList"><div class="empty">লোড হচ্ছে...</div></div>
      </div>

      <!-- Stories Panel -->
      <div id="apanel-stories" class="panel hidden">
        <div class="panel-title">সকল স্টোরি কন্ট্রোল</div>
        <div id="adminStoriesList"><div class="empty">লোড হচ্ছে...</div></div>
      </div>

      <!-- Broadcast Notification Panel -->
      <div id="apanel-broadcast" class="panel hidden">
        <div class="panel-title">সকল ইউজারকে নোটিফিকেশন পাঠান</div>
        <textarea id="broadcastText" rows="3" class="field" placeholder="যেমন: BondhuBook-এ নতুন আপডেট এসেছে! সবাইকে স্বাগতম।"></textarea>
        <button id="sendBroadcastBtn" class="btn btn-primary">সব ইউজারকে নোটিফিকেশন পাঠান</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, addDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCG_svkcE_wDDYo3URQRJX3qZW5dNywf2k",
      authDomain: "bondhubook-aa8c3.firebaseapp.com",
      projectId: "bondhubook-aa8c3",
      storageBucket: "bondhubook-aa8c3.firebasestorage.app",
      messagingSenderId: "468657628297",
      appId: "1:468657628297:web:b5475344b3328ddf95d258",
      measurementId: "G-K9CYNQXLJJ"
    };

    const DEFAULT_AVATAR = "https://i.ibb.co/4pDNDk1/avatar.png";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usersCache = [];

    document.getElementById("adminLoginBtn").onclick = async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value.trim();
      if (!email || !pass) return alert("ইমেইল ও পাসওয়ার্ড দিন");
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        alert("লগইন ব্যর্থ: " + e.message);
      }
    };

    document.getElementById("adminLogoutBtn").onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("adminLoginBox").classList.add("hidden");
        document.getElementById("adminDashboard").classList.remove("hidden");
        document.getElementById("adminIdentity").textContent = user.email;
        startAdminListeners();
      } else {
        document.getElementById("adminLoginBox").classList.remove("hidden");
        document.getElementById("adminDashboard").classList.add("hidden");
      }
    });

    window.switchAdminTab = (name) => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.atab === name));
      ["users", "posts", "stories", "broadcast"].forEach(t => {
        document.getElementById(`apanel-${t}`).classList.toggle("hidden", t !== name);
      });
    };

    function startAdminListeners() {
      // Users
      onSnapshot(collection(db, "users"), (snap) => {
        usersCache = [];
        let bannedCount = 0;
        snap.forEach(d => {
          const data = { id: d.id, ...d.data() };
          usersCache.push(data);
          if (data.isBanned) bannedCount++;
        });
        document.getElementById("statUsers").textContent = usersCache.length;
        document.getElementById("statBanned").textContent = bannedCount;
        renderAdminUsers();
      });

      // Posts
      onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
        const box = document.getElementById("adminPostsList");
        document.getElementById("statPosts").textContent = snap.size;
        box.innerHTML = "";
        if (snap.empty) {
          box.innerHTML = '<div class="empty">কোনো পোস্ট নেই</div>';
          return;
        }
        snap.forEach(d => {
          const p = d.data();
          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div class="item-left">
              ${p.imageUrl ? `<img class="post-thumb" src="${p.imageUrl}" />` : `<img src="${p.authorPhoto || DEFAULT_AVATAR}" />`}
              <div>
                <h4>${esc(p.authorName || "ইউজার")}</h4>
                <p>${esc(p.text || p.videoUrl || "মিডিয়া পোস্ট")}</p>
              </div>
            </div>
            <div class="actions">
              <button class="btn-sm btn-danger">ডিলিট</button>
            </div>
          `;
          row.querySelector("button").onclick = async () => {
            if (confirm("এই পোস্টটি ডিলিট করতে চান?")) {
              await deleteDoc(doc(db, "posts", d.id));
            }
          };
          box.appendChild(row);
        });
      });

      // Stories
      onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc")), (snap) => {
        const box = document.getElementById("adminStoriesList");
        document.getElementById("statStories").textContent = snap.size;
        box.innerHTML = "";
        if (snap.empty) {
          box.innerHTML = '<div class="empty">কোনো স্টোরি নেই</div>';
          return;
        }
        snap.forEach(d => {
          const s = d.data();
          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <div class="item-left">
              <img class="post-thumb" src="${s.imageUrl}" />
              <div>
                <h4>${esc(s.userName || "ইউজার")}</h4>
                <p>স্টোরি</p>
              </div>
            </div>
            <div class="actions">
              <button class="btn-sm btn-danger">ডিলিট</button>
            </div>
          `;
          row.querySelector("button").onclick = async () => {
            if (confirm("এই স্টোরিটি ডিলিট করতে চান?")) {
              await deleteDoc(doc(db, "stories", d.id));
            }
          };
          box.appendChild(row);
        });
      });
    }

    document.getElementById("adminUserSearch").oninput = () => renderAdminUsers();

    function renderAdminUsers() {
      const box = document.getElementById("adminUsersList");
      const q = document.getElementById("adminUserSearch").value.toLowerCase();
      const filtered = usersCache.filter(u =>
        (u.name || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q)
      );
      box.innerHTML = "";
      if (!filtered.length) {
        box.innerHTML = '<div class="empty">কোনো ইউজার পাওয়া যায়নি</div>';
        return;
      }
      filtered.forEach(u => {
        const banned = !!u.isBanned;
        const row = document.createElement("div");
        row.className = "item-row";
        row.innerHTML = `
          <div class="item-left">
            <img src="${u.photoURL || DEFAULT_AVATAR}" />
            <div>
              <h4>${esc(u.name || "নাম নেই")} <span class="${banned ? 'badge-ban' : 'badge-ok'}">${banned ? 'Banned' : 'Active'}</span></h4>
              <p>${esc(u.email || "")} • UID: ${esc(u.uid || u.id)}</p>
            </div>
          </div>
          <div class="actions">
            <button class="btn-sm ${banned ? 'btn-success' : 'btn-warn'}">${banned ? 'Unban' : 'Ban'}</button>
            <button class="btn-sm btn-danger">ডিলিট</button>
          </div>
        `;
        const [banBtn, delBtn] = row.querySelectorAll("button");
        banBtn.onclick = async () => {
          await updateDoc(doc(db, "users", u.id), { isBanned: !banned });
        };
        delBtn.onclick = async () => {
          if (confirm(`${u.name || 'এই ইউজার'}-এর ডাটা ডিলিট করতে চান?`)) {
            await deleteDoc(doc(db, "users", u.id));
          }
        };
        box.appendChild(row);
      });
    }

    // Broadcast Notification
    document.getElementById("sendBroadcastBtn").onclick = async () => {
      const txt = document.getElementById("broadcastText").value.trim();
      if (!txt) return alert("নোটিফিকেশনের লেখা দিন");
      const btn = document.getElementById("sendBroadcastBtn");
      btn.disabled = true;
      try {
        const snap = await getDocs(collection(db, "users"));
        const promises = [];
        snap.forEach(d => {
          promises.push(addDoc(collection(db, "notifications"), {
            toUid: d.id,
            text: `📢 অ্যাডমিন ঘোষণা: ${txt}`,
            createdAt: serverTimestamp()
          }));
        });
        await Promise.all(promises);
        document.getElementById("broadcastText").value = "";
        alert(`${promises.length} জন ইউজারকে নোটিফিকেশন পাঠানো হয়েছে!`);
      } catch (e) {
        alert("সমস্যা হয়েছে: " + e.message);
      } finally {
        btn.disabled = false;
      }
    };

    function esc(s) {
      return (s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
  </script>
</body>
  </html>
